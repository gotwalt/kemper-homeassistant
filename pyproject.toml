[project]
# A development shell, not a distributable: the integration ships as the
# `custom_components/kemper` directory, and Home Assistant loads it from a
# config directory rather than from a wheel. This file exists so `uv sync` can
# put Home Assistant's test harness — and the libkp release the manifest asks
# for — on the path.
name = "kemper-homeassistant"
version = "0.3.0"
description = "Development environment for the Kemper Profiler Home Assistant integration."
requires-python = ">=3.14.2"
dependencies = [
    # The version `custom_components/kemper/manifest.json` requires, so the
    # tests run against exactly what Home Assistant will install. test_manifest
    # fails if the two drift apart.
    "libkp==0.2.0",
    # Pins homeassistant==2026.8.3 and brings pytest + the custom-component fixtures.
    "pytest-homeassistant-custom-component==0.13.357",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
# "." for `custom_components.kemper`; libkp comes from the environment.
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
# dist/ is build output.
extend-exclude = ["dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
